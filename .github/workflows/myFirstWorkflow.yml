name: my-first-workflow
on: 
  workflow_dispatch:
  push: 

jobs:
  JOB1:
   runs-on: ubuntu-latest
   steps:
     - name: Step-1
       run: |
          pwd
          ls -ltr
          hostname
     - name: Step-2 Checkout
       uses: actions/checkout@v5.1.0
     - name: Step-3
       run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
          ls -ltr
          hostname
          
     - name: Upload Single file
       uses: actions/upload-artifact@v7.0.1
       with:
         name: single_file
         path: ./myartifact.txt
         
     - name: Upload from directory
       uses: actions/upload-artifact@v7.0.1
       with:
         name: directory_artifact
         path: artifacts/
         
     - name: upload from multiple paths
       uses: actions/upload-artifact@v7.0.1
       with:
         name: multiple_path
         path: |
            ./myartifact.txt
            artifacts/
            
     - name: upload from multiple paths with exclusion
       uses: actions/upload-artifact@v7.0.1
       with:
         name: multiple_path_with_exclusion
         path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt

  job2:
    name: JOB2
    needs: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Checking Current Directory
        run: |
          pwd
          ls -ltr
      - name: Download Single file artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: single_file
      - name: Checking current directory post download
        run: |
           pwd
           ls -ltr
  job3:
   name: JOB3
   needs: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Checking Current directory
       run: |
         pwd
         ls -ltr
     - name: Download Directory
       uses: actions/download-artifact@v7.0.0
       with:
         name: directory_artifact
     - name: chekcing current directory post download
       run: |
        pwd
        ls -ltr

  job4:
   name: JOB4
   needs: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: Creating custom folder for download
       run: |
         mkdir -p single_file
         mkdir -p download_directory
         
     - name: Checking Current directory
       run: |
         pwd
         ls -ltr
         
     - name: Download single file artifact
       uses: actions/download-artifact@v7.0.0
       with:
         name: single_file
         path: single_file
         
     - name: Download Directory
       uses: actions/download-artifact@v7.0.0
       with:
         name: directory_artifact
         path: download_directory
         
     - name: chekcing current directory post download
       run: |
        pwd
        echo "CHECKING SINGLE FILE DIRECTORY"
        ls -ltr single_file
        echo "CHECKING DIRECTORY ARTIFACT"
        ls -ltr download_directory
     
           
        
      
