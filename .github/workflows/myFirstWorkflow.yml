name: my-first-workflow
on: 
  # push:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running Single Command in Job1
        run: echo "Hi This is my first Github Workflow."
      - name: Checking OS Release for GitHub Hosted Runner
        run: cat /etc/os-release
      - name: Calling Sleep
        run: sleep 20

  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the Hostname for Runner
        run: hostname
      - name: Running Multiple Command
        run: |
          echo "Hi From Javed Ahmad"
          echo "Current time is `date`"
          sleep 20

  job3:
    name: JOB3
    needs: job1
    runs-on: windows-latest
    steps:
      - name: Job with Single Dependency
        shell: pwsh
        run: Start-Sleep -Seconds 10
      - name: Checking Runner Info
        shell: pwsh
        run: Get-ComputerInfo

  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: macos-latest
    steps:
      - name: Job with multiple dependencies
        run: sleep 10
      - name: Checking Runner Info
        run: sw_vers
