name: my-first-workflow
on: 
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push: 

jobs:
  JOB1:
   runs-on: ubuntu-latest
   steps:
     - name: Step-1
       run: |
          pwd
          ls -ltr
          hostname
     - name: Step-2 Checkout
       uses: actions/checkout@v5.1.0
     - name: Step-3
       run: |
          echo `pwd` >> myartifact.txt
          ls -ltr
          hostname
     - name: Upload Single file
       uses: actions/upload-artifact@v7.0.1
       with:
         name: single_file
         path: ./myartifact.txt
        
      
