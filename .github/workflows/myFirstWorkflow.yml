name: my-first-workflow
on: 
  push:
   branches:
     - dev
     - 'feature-*'
     - main
  pull_request:
    branches:
      - main

jobs:
  JOB1:
   runs-on: ubuntu-latest
   steps:
     - name: Step-1
       run: |
          pwd
          ls -ltr
          hostname
     - name: Step-2 Checkout
       uses: actions/checkout@v5.1.0
     - name: Step-3
       run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
          ls -ltr
          hostname
          
     - name: Upload Single file
       uses: actions/upload-artifact@v7.0.1
       with:
         name: single_file
         path: ./myartifact.txt
         
  job2:
    name: JOB2
    needs: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Checking Current Directory
        run: |
          pwd
          ls -ltr
      - name: Download Single file artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: single_file
      - name: Checking current directory post download
        run: |
           pwd
           ls -ltr
      - name: Step for PR Demo
        run: exit 1
           
        
      
