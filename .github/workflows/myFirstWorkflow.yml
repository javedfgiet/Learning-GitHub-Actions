name: my-first-workflow
on: 
  workflow_dispatch:
  push: 
   branches:
     - main
  pull_request:
    branches:
      - main

jobs:
  unit-test:
   name: Running Unit Test
   runs-on: ubuntu-latest
   steps:
     - name: Checkout Code
       uses: actions/checkout@v6.1.0
     - name: Setup Python
       uses: actions/setup-python@v7.0.0
       with:
         python-version: '3.10'
     
     - name: Install Dependencies
       run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

     - name: Run Unit Tests
       run: |
        mkdir reports/
        pytest --junitxml=reports/unit-test-results.xml \
           --cov=app \
           --cov-report=xml:reports/coverage.xml \
           --cov-report=html:reports/html \
           --cov-report=term-missing \
           -v

     - name: Upload code coverage report
       uses: actions/upload-artifact@v7.0.1
       with:
         name: unit-test-coverage-report
         path: reports/

  codeql:
      name: CodeQL Security Scan
      runs-on: ubuntu-latest
      permissions:
        actions: read
        contents: read
        security-events: write #Required to upload the results of the CodeQL analysis to GitHub
      strategy:
        matrix:
          language: [ 'python' ]
      steps:
        - name: Checkout code
          uses: actions/checkout@v6.1.0
        - name: Initialize CodeQL
          uses: github/codeql-action/init@v3.6.0
          with:
            languages: ${{ matrix.language }}
        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v3.6.0
          with:
            category: "security"


        
      
